name: CI/CD

on:
    push:
        branches:
            - main
            - alpha
            - beta
    pull_request:
        branches:
            - main
            - alpha
            - beta

env:
    CI: true

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Use Node.js 22
              uses: actions/setup-node@v5
              with:
                  node-version: 22.x

            - run: npm install

            - name: Test Project Scaffolding & Build
              run: |
                  mkdir -p /tmp/test-ci-web
                  node bin/vertigis-web-sdk.js create /tmp/test-ci-web/sample-app --no-skills
                  cd /tmp/test-ci-web/sample-app
                  npm run build
                  test -f build/main.js

    # semantic-release reads the Conventional Commits since the last tag, sets the version,
    # publishes to npm, and makes the git tag and the GitHub Release.
    release:
        runs-on: ubuntu-latest
        needs:
            - test
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/alpha' || github.ref == 'refs/heads/beta')
        permissions:
            contents: write
            issues: write
            pull-requests: write
            packages: write
        steps:
            - uses: actions/checkout@v5
              with:
                  # semantic-release needs all commits and tags to find the next version.
                  fetch-depth: "0"
                  persist-credentials: false

            - name: Use Node.js 22
              uses: actions/setup-node@v5
              with:
                  node-version: 22.x

            # Do not run "npm install" here. The project pins conventional-changelog-conventionalcommits 7,
            # which semantic-release 24 cannot use. Without node_modules, it uses the version 8 below.
            - name: Release to npm
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: npx --yes -p semantic-release@24 -p conventional-changelog-conventionalcommits@8 semantic-release

            # A GitHub Release made with GITHUB_TOKEN does not start other workflows.
            # Thus, publish to GitHub Packages in this job.
            - name: Find the new release
              id: released
              run: |
                  if git tag --points-at HEAD | grep -q '^v'; then
                      echo "done=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "No new release."
                  fi

            - name: Release to GitHub Packages
              if: steps.released.outputs.done == 'true'
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); pkg.name = '@geosynk-lab/' + pkg.name.split('/')[1]; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));"
                  echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > "$RUNNER_TEMP/.npmrc"
                  npm publish --registry=https://npm.pkg.github.com --userconfig "$RUNNER_TEMP/.npmrc"
